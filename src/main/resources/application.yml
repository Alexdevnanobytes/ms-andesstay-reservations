# Configuración del microservicio de reservas. ${VARIABLE:valor} = variable de entorno o valor por defecto.
server:
  port: ${PORT:8081}
# Conexión a la base de datos PostgreSQL en AWS RDS. La contraseña nunca se escribe aquí:
# llega por la variable RESERVATIONS_DB_PASSWORD (archivo .env en el EC2).
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:andesstay}
    password: ${RABBITMQ_PASSWORD:andesstay-dev-only}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  datasource:
    url: ${DB_URL}
    username: ${RESERVATIONS_DB_USER}
    password: ${RESERVATIONS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # JPA/Hibernate: open-in-view desactivado (la conexión a la base no queda abierta durante toda la petición).
  jpa:
    open-in-view: false
    # validate: Hibernate solo comprueba que las entidades calcen con las tablas.
    # Las tablas las crea y modifica Flyway, no Hibernate.
    hibernate:
      ddl-auto: validate
  # Flyway: migraciones versionadas en src/main/resources/db/migration.
  # table: historial propio de este servicio, porque catalog comparte la base y tendrá el suyo.
  # baseline-on-migrate con baseline-version 0: en una base que ya tiene tablas, Flyway parte
  # desde 0 y aplica V1 (que no cambia nada si la tabla existe) y V2.
  flyway:
    enabled: true
    table: flyway_schema_history_reservations
    baseline-on-migrate: true
    baseline-version: "0"
# Token compartido con el BFF y con catalog (header X-Internal-Token).
internal:
  token: ${INTERNAL_TOKEN:}
rabbitmq:
  management-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
  username: ${RABBITMQ_USER:andesstay}
  password: ${RABBITMQ_PASSWORD:andesstay-dev-only}
# Dirección de ms-andesstay-catalog, al que se llama para ocupar y liberar unidades.
catalog:
  base-url: ${CATALOG_URL:http://localhost:8082}
